[build-system]
requires = [
    "setuptools",
    "setuptools-scm",
]

build-backend = "setuptools.build_meta"

[project]
name = "bridger"
dynamic = ["version"]
description = "A bridge between MQTT and InfluxDB for Meshtastic metrics"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name="Andy Shinn", email="andys@andyshinn.as" },
]

dependencies = [
    "aiohttp",
    "aiomqtt",
    "aiocache",
    "cryptography",
    "dataclasses-json",
    "discord.py",
    "influxdb-client",
    "loguru",
    "meshtastic",
    "paho-mqtt",
    "protobuf",
    "python-dotenv",
    "requests",
    "rich",
    "sentry-sdk",
    "tenacity",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-aiohttp",
    "pytest-cov",
    "requests-mock",
]

[project.scripts]
bridger = "bridger.cli:main"

[project.urls]
Source = "https://github.com/austinmesh/bridger"
Graphs = "https://graphs.austinmesh.org"

[tool.setuptools.packages.find]
include = ["bridger*"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # Keep Optional[X] and Union[X, Y] rather than PEP 604's X | None / X | Y. The point
    # classes are all @dataclass_json, which introspects annotations at runtime, and ruff's
    # own UP045 docs warn that PEP 604 syntax can break libraries that do that.
    "UP007",
    "UP045",
]

[tool.ruff.lint.isort]
known-first-party = ["bridger"]

[tool.ruff.lint.per-file-ignores]
# Tests trigger properties inside pytest.raises() by bare attribute access, which
# is the standard idiom but reads as a useless expression to flake8-bugbear.
"tests/**" = ["B018"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = [
    "--cov=bridger",
    "--cov-report=term-missing",
]
